start:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: irrigazione_ai
    duration:
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min
          mode: box
    force:
      default: false
      selector:
        boolean:

stop:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: irrigazione_ai

analyze:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: irrigazione_ai

set_schedule:
  target:
    entity:
      integration: irrigazione_ai
      domain: select
  fields:
    mode:
      selector:
        select:
          options:
            - "off"
            - alternate
            - days
            - daily
          translation_key: schedule
    days:
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
          translation_key: weekday
